apiVersion: v1
kind: Pod
metadata:
  name: ml-tracking-interactive
  namespace: cern-cms-gpu-tracking
  labels:
    app: ml-tracking-interactive
spec:
  containers:
  - name: ml-tracking-interactive-container
    image: alexandertuna/ml-tracking:latest
    args: ["sleep", "infinity"]
    resources:
      limits:
        memory: 24Gi
        cpu: 8
        nvidia.com/a100: 1
      requests:
        memory: 16Gi
        cpu: 8
        nvidia.com/a100: 1
    volumeMounts:
    - mountPath: /data
      name: ml-tracking-interactive-pvc
    - mountPath: /dev/shm
      name: dshm
  volumes:
  - name: ml-tracking-interactive-pvc
    persistentVolumeClaim:
      claimName: ml-tracking-pvc
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 2Gi
  restartPolicy: Never
