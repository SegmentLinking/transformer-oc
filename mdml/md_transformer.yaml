# MDTransformerNet config (mdml/md_transformer.py). Defaults are the best scratch run so far.
# The same paths work on phi3 (with data/ bound to /data) and on NRP (the PVC at /data).

# ---- run paths
train_dir: /data/mdml/train
val_dir: /data/mdml/val
output_dir: /data/output/mdml/md_transformer

# ---- events
n_train_events: 3000
# The last n_val_events of val_dir: validation loss, working point and [md_quality]. The harness evaluates the
# first validation file, so these must not reach into it
n_val_events: 50
# MDs of sims below this pT (GeV) count as fake
pt_min: 0.8

# ---- patches (all half-widths; eta, and phi in rad)
patches_per_event: 8
patch_eta: 0.25
patch_phi: 0.5
# Context around the patch: seen by attention, not in the loss or predictions
margin_eta: 0.25
margin_phi: 0.5

# ---- network
n_blocks: 4
hidden: 64
n_heads: 4
dropout: 0.0
# false: phi only relative to the patch centre (phi-symmetric network); true: also each MD's absolute phi
absolute_phi: false
# Learned per-MD embedding for clustering, trained with a contrastive loss; 0: none
embed_dim: 0

# ---- attention windows per layer pair (LayerPairWindows.from_events)
# Quantile of |deta| and |dphi| of same-sim MD pairs; larger is looser
window_quantile: 0.9
# Multiplies every window; > 1 relaxes them (e.g. on a larger GPU)
window_scale: 1.0
# Training events the windows are measured on
window_n_events: 20

# ---- training
epochs: 3
lr: 0.001
weight_decay: 0.01
mse_weight: 1.0
# MSE of asinh(sim_vz / SIM_VZ_SCALE) and log1p(sim_vtxperp / SIM_VTXPERP_SCALE) (md_transformer.py); 0: off
sim_vz_weight: 0.0
sim_vtxperp_weight: 0.0
# Contrastive loss (if embed_dim > 0): pull same-sim MDs together, push others beyond contrastive_margin
contrastive_weight: 1.0
contrastive_margin: 1.0
seed: 42
device: cuda
cpu_threads: 8
precision: 32
num_workers: 8
log_every: 200

# ---- inference and working point
# What DBSCAN clusters: kinematics (predicted SIM_KINEMATICS) or embedding (needs embed_dim > 0)
cluster_space: kinematics
# Patches (from the patch grid, with their margin) per forward pass
patches_per_batch: 4
# fake_cut keeps this fraction of real MDs
fake_keep: 0.8
# eps: this quantile of each kept real MD's distance in cluster_space to its (MIN_MDS - 1)-th nearest same-sim neighbour
eps_quantile: 0.5
